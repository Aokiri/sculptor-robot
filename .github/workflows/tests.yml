name: Tests and evaluation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv pip install -r tests/requirements.txt
      - run: uv run --no-sync python -m pytest -c tests/pytest.ini
      - run: uv run --no-sync python -m experiments.evaluate --demo
